name: robe-event-platform

services:
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --project=robe-local
      - --host-port=0.0.0.0:8085
    ports:
      - "127.0.0.1:8085:8085"
    networks:
      - default
      - event-platform-dev

networks:
  default: {}
  event-platform-dev:
    name: robe-event-platform-dev
