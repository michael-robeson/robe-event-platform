[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robe-event-platform-slice"
version = "0.1.0"
description = "Local Pub/Sub-to-PostgreSQL vertical slice for Robe Event Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "google-cloud-pubsub>=2.30,<3",
    "jsonschema[format]>=4.23,<5",
    "psycopg[binary]>=3.2,<4",
    "referencing>=0.35,<1",
    "rfc8785>=0.1.4,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
