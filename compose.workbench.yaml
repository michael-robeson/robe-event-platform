services:
  workbench:
    build:
      context: .
      dockerfile: apps/workbench/Dockerfile
    environment:
      DATABASE_HOST: ${WORKBENCH_DATABASE_HOST:-postgres}
      DATABASE_PORT: ${WORKBENCH_DATABASE_PORT:-5432}
      DATABASE_NAME: ${WORKBENCH_DATABASE_NAME:-robe_events}
      DATABASE_USER: ${WORKBENCH_DATABASE_USER:-workbench_reader}
      DATABASE_PASSWORD: ${WORKBENCH_DB_PASSWORD:-}
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: robe-local
      WORKBENCH_SERVICE_URLS: '${WORKBENCH_SERVICE_URLS:-["http://email-gmail:8000"]}'
      WORKBENCH_SYNTHETIC_PUBLISH_ENABLED: "${WORKBENCH_SYNTHETIC_PUBLISH_ENABLED:-false}"
    networks:
      - default
      - event-platform-dev
    depends_on:
      pubsub:
        condition: service_started
    ports:
      - "127.0.0.1:8083:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"
      interval: 2s
      timeout: 2s
      retries: 20

networks:
  default: {}
  event-platform-dev:
    external: true
    name: robe-event-platform-dev
