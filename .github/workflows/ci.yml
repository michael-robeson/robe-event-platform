name: CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests/unit -q

  integration:
    name: Pub/Sub and PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install '.[test]'
      - name: Generate temporary local database passwords
        run: |
          admin_password=$(openssl rand -hex 24)
          app_password=$(openssl rand -hex 24)
          audit_password=$(openssl rand -hex 24)
          workbench_password=$(openssl rand -hex 24)
          echo "::add-mask::$admin_password"
          echo "::add-mask::$app_password"
          echo "::add-mask::$audit_password"
          echo "::add-mask::$workbench_password"
          echo "POSTGRES_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "ITEM_PROJECTION_DB_PASSWORD=$app_password" >> "$GITHUB_ENV"
          echo "AUDIT_PROJECTION_DB_PASSWORD=$audit_password" >> "$GITHUB_ENV"
          echo "WORKBENCH_DB_PASSWORD=$workbench_password" >> "$GITHUB_ENV"
      - name: Start PostgreSQL
        run: docker compose --profile demo -f compose.yaml -f compose.demo.yaml up --build --wait --wait-timeout 120 postgres
      - name: Build audit migration image
        run: docker compose --profile demo -f compose.yaml -f compose.demo.yaml build audit-migrate
      - name: Verify migration on existing item data
        run: python -m pytest tests/migration -q
      - name: Start local services
        run: >-
          docker compose --profile demo -f compose.yaml -f compose.demo.yaml up --build --wait --wait-timeout 120
          pubsub postgres publisher item-projection-consumer ack-fault-proxy
          audit-consumer audit-ack-fault-proxy
      - name: Provision emulator topic and subscription
        run: docker compose --profile demo -f compose.yaml -f compose.demo.yaml run --rm pubsub-bootstrap
      - name: Start the workbench
        run: docker compose --profile demo -f compose.yaml -f compose.demo.yaml -f compose.workbench.yaml up --build --wait --wait-timeout 120 workbench
      - name: Run end-to-end tests
        run: python -m pytest tests/e2e tests/workbench -q
      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile demo -f compose.yaml -f compose.demo.yaml -f compose.workbench.yaml logs --no-color
